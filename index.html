<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <title>multi-translatator</title>
  </head>

  <body
    class="d-flex justify-content-center align-items-center min-vh-100 bg-secondary"
  >
    <div class="card bg-black text-white p-4 shadow-lg rounded-3 custom-card">
      <div class="text-center mb-4">
        <h1
          class="d-inline-block bg-primary text-white fs-3 fw-bold px-3 py-1 rounded"
        >
          Translator App
        </h1>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <textarea
            id="from-text"
            class="form-control text-white custom-textarea-from"
            rows="7"
            placeholder="Enter text..."
          ></textarea>
        </div>

        <div class="col-6">
          <textarea
            id="to-text"
            class="form-control text-white custom-textarea-to"
            rows="7"
            readonly
            placeholder="Translation..."
          ></textarea>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <select
            id="from-lang"
            class="form-select bg-dark text-white border-secondary"
          ></select>
        </div>
        <div class="col-6">
          <select
            id="to-lang"
            class="form-select bg-dark text-white border-secondary"
          ></select>
        </div>
      </div>

      <div class="text-center">
        <button
          id="translate-btn"
          class="btn btn-outline-primary px-4 py-2 fw-semibold"
        >
          Translate
        </button>
      </div>
    </div>
    <script src="countries.js"></script>
    <script src="main.js"></script>
  </body>
</html>
